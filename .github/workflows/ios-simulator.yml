name: iOS simulator build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check bundled vocabulary
        run: node tools/verify-word-data.mjs

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project LockWord.xcodeproj
          -scheme WordLock
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath "$RUNNER_TEMP/WordLockDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Install and launch on an iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/WordLockDerivedData/Build/Products/Debug-iphonesimulator/WordLock.app"
          device_id="$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([0-9A-F-]{36}\)' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch "$device_id" kr.co.lockword.ios
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/wordlock-iphone-simulator.png"

      - name: Keep simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: wordlock-ios-simulator
          path: |
            ${{ runner.temp }}/WordLockDerivedData/Build/Products/Debug-iphonesimulator/WordLock.app
            ${{ runner.temp }}/wordlock-iphone-simulator.png
          if-no-files-found: error

